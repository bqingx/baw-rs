name: ci

# Builds and tests off this machine, on GitHub-hosted runners. Used while a local box must not be
# occupied by a 3-minute release build, and as the pre-merge check for pushes to main.
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: TZ=UTC cargo test --release --locked --all-targets -- --test-threads=1
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --locked --bin baw-rs
      - name: Offline release smoke
        run: python3 scripts/smoke_release.py --binary target/release/baw-rs --output /tmp/baw-release-smoke.json
      - name: Skill checks for this artifact
        run: |
          python3 scripts/build_skill_reference.py --binary target/release/baw-rs
          python3 tests/test_baw_skill.py --binary target/release/baw-rs
      - name: Record hash
        run: |
          set -eu
          mkdir -p dist
          cp target/release/baw-rs dist/baw-rs-x86_64-unknown-linux-gnu
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: baw-rs-${{ github.sha }}
          path: dist/*
